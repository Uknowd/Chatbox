<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Artemis Anonymous ChatBox</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
    margin: 0;
    background: #000;
    color: #00ffcc;
    font-family: monospace;
    height: 100vh;
    display: flex;
    flex-direction: column;
}

/* HEADER */
header {
    padding: 12px;
    text-align: center;
    border-bottom: 1px solid #00ffcc;
    letter-spacing: 2px;
}

/* LOGIN BOX */
#login {
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 10px;
}

input {
    padding: 10px;
    background: black;
    border: 1px solid #00ffcc;
    color: #00ffcc;
    outline: none;
}

button {
    padding: 10px;
    background: #00ffcc;
    border: none;
    cursor: pointer;
    font-weight: bold;
}

/* CHAT */
#app {
    display: none;
    flex: 1;
    flex-direction: column;
}

#chat {
    flex: 1;
    overflow-y: auto;
    padding: 10px;
}

.msg {
    background: rgba(0,255,204,0.06);
    border-left: 3px solid #00ffcc;
    padding: 10px;
    margin-bottom: 10px;
    border-radius: 6px;
}

/* INPUT BAR */
.input-bar {
    display: flex;
    gap: 5px;
    padding: 10px;
    border-top: 1px solid #00ffcc;
}

.input-bar input {
    flex: 1;
}

/* HIDE */
.hidden {
    display: none;
}
</style>
</head>

<body>

<header>ARTEMIS CHATBOX</header>

<!-- INSCRIPTION SIMPLE -->
<div id="login">
    <h3>👤 Choisis ton pseudo</h3>
    <input id="name" placeholder="Ex: Ghost_07">
    <button onclick="join()">Entrer dans le chat</button>
</div>

<!-- APP -->
<div id="app">

<div id="chat"></div>

<div class="input-bar">
    <input id="msg" placeholder="Message...">
    <button onclick="send()">➤</button>
</div>

</div>

<!-- FIREBASE -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

<script>

const firebaseConfig = {
  apiKey: "AIzaSyAVZZ_Nogu2giA73PfaEKl5e6t6F8Tj9tI",
  authDomain: "artemis-chat-3cf80.firebaseapp.com",
  projectId: "artemis-chat-3cf80",
};

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

let username = "";

/* 🔐 JOIN CHAT */
function join() {
    let name = document.getElementById("name").value;

    if (!name) return;

    username = name;

    document.getElementById("login").style.display = "none";
    document.getElementById("app").style.display = "flex";

    listen();
}

/* 💬 SEND */
function send() {
    let msg = document.getElementById("msg").value;

    if (!msg) return;

    db.collection("messages").add({
        name: username,
        msg,
        time: firebase.firestore.FieldValue.serverTimestamp()
    });

    document.getElementById("msg").value = "";
}

/* 📡 REALTIME */
function listen() {
    db.collection("messages")
    .orderBy("time")
    .limit(100)
    .onSnapshot(snapshot => {

        let chat = document.getElementById("chat");
        chat.innerHTML = "";

        snapshot.forEach(doc => {
            let m = doc.data();

            chat.innerHTML += `
            <div class="msg">
                👤 ${m.name}<br>
                ${m.msg}
            </div>`;
        });

        chat.scrollTop = chat.scrollHeight;

        /* 🔔 notification */
        let last = snapshot.docs[snapshot.docs.length - 1];
        if (last) {
            let data = last.data();

            if (Notification.permission === "granted") {
                new Notification(data.name, {
                    body: data.msg
                });
            }
        }
    });
}

/* 🔔 permission notif */
if ("Notification" in window) {
    Notification.requestPermission();
}

</script>

</body>
</html>
