<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>ARTEMIS DARKNET NODE</title>

<style>
body {
    margin: 0;
    background: radial-gradient(circle, #020202, #000);
    color: #00ffcc;
    font-family: monospace;
    overflow: hidden;
}

/* TOP BAR */
header {
    text-align: center;
    padding: 10px;
    border-bottom: 1px solid #00ffcc;
    letter-spacing: 3px;
}

/* GRID */
.container {
    display: grid;
    grid-template-columns: 1fr 1fr;
    height: 90vh;
}

/* LEFT PANEL */
.left {
    border-right: 1px solid #00ffcc;
    padding: 10px;
}

/* RIGHT PANEL */
.right {
    padding: 10px;
}

/* INPUTS */
input, textarea {
    width: 100%;
    margin-top: 10px;
    padding: 8px;
    background: black;
    border: 1px solid #00ffcc;
    color: #00ffcc;
    font-family: monospace;
}

button {
    width: 100%;
    margin-top: 10px;
    padding: 10px;
    background: #00ffcc;
    border: none;
    cursor: pointer;
    font-weight: bold;
}

/* WALL */
.msg {
    border-left: 3px solid #00ffcc;
    padding: 8px;
    margin-top: 10px;
    background: rgba(0,255,204,0.05);
    animation: flicker 2s infinite;
}

@keyframes flicker {
    0%,100% {opacity: 1;}
    50% {opacity: 0.6;}
}

/* GLOBAL MAP */
#map {
    height: 300px;
    border: 1px solid #00ffcc;
    margin-top: 10px;
    position: relative;
    overflow: hidden;
}

/* FAKE NODES */
.node {
    width: 6px;
    height: 6px;
    background: #00ffcc;
    border-radius: 50%;
    position: absolute;
    animation: pulse 2s infinite;
}

@keyframes pulse {
    0% {transform: scale(1);}
    50% {transform: scale(2);}
    100% {transform: scale(1);}
}

/* GLITCH TEXT */
.glitch {
    animation: glitch 1s infinite;
}

@keyframes glitch {
    0% {transform: translate(0);}
    20% {transform: translate(-1px,1px);}
    40% {transform: translate(1px,-1px);}
    60% {transform: translate(-1px,0);}
    80% {transform: translate(1px,1px);}
    100% {transform: translate(0);}
}

small {
    opacity: 0.6;
}
</style>
</head>

<body>

<header class="glitch">
ARTEMIS DARKNET NETWORK // GLOBAL NODE ACCESS
</header>

<div class="container">

<!-- LEFT -->
<div class="left">

<h3>📡 NODE TRANSMISSION</h3>

<input id="agent" placeholder="Agent ID (ex: Ghost_07)">
<textarea id="msg" placeholder="Encrypted message..."></textarea>

<button onclick="send()">TRANSMIT INTO DARKNET</button>

<div id="wall"></div>

</div>

<!-- RIGHT -->
<div class="right">

<h3>🌐 GLOBAL NETWORK MAP</h3>

<div id="map"></div>

<small>Simulation active - nodes unstable</small>

<h3>🎯 ACTIVE MISSIONS</h3>

<div class="msg">🔓 Extract data from node #AX-77</div>
<div class="msg">🛰️ Intercept signal in zone: North Grid</div>
<div class="msg">⚠ Avoid detection from TRACE AI</div>

</div>

</div>

<!-- FIREBASE -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

<script>

const firebaseConfig = {
  apiKey: "AIzaSyAVZZ_Nogu2giA73PfaEKl5e6t6F8Tj9tI",
  authDomain: "artemis-chat-3cf80.firebaseapp.com",
  projectId: "artemis-chat-3cf80",
  storageBucket: "artemis-chat-3cf80.firebasestorage.app",
  messagingSenderId: "611371734351",
  appId: "1:611371734351:web:c3e4f6b0d5ec0ced3ee13a"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

/* FAKE DARKNET NODES */
function createNodes() {
    let map = document.getElementById("map");
    for(let i=0;i<25;i++) {
        let node = document.createElement("div");
        node.className = "node";
        node.style.top = Math.random()*100 + "%";
        node.style.left = Math.random()*100 + "%";
        map.appendChild(node);
    }
}
createNodes();

/* SEND MESSAGE */
function send() {
    let agent = document.getElementById("agent").value;
    let msg = document.getElementById("msg").value;

    if(!agent || !msg) return;

    db.collection("messages").add({
        agent: agent,
        msg: msg,
        time: firebase.firestore.FieldValue.serverTimestamp()
    });

    document.getElementById("msg").value = "";
}

/* LOAD REALTIME */
db.collection("messages")
  .orderBy("time")
  .limit(50)
  .onSnapshot(snapshot => {

    let wall = document.getElementById("wall");
    wall.innerHTML = "";

    snapshot.forEach(doc => {
        let m = doc.data();
        let div = document.createElement("div");
        div.className = "msg";

        div.innerHTML = `
            <b>👤 ${m.agent}</b><br>
            ${m.msg}<br>
            <small>🌐 Live Transmission</small>
        `;

        wall.appendChild(div);
    });

});

</script>

</body>
</html>
