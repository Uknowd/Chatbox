<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>ARTEMIS V7</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<!-- PWA -->
<link rel="manifest" href="manifest.json">

<style>
body{
margin:0;
font-family: monospace;
background:#000;
color:#00ffcc;
}

nav{
display:flex;
justify-content:space-around;
padding:10px;
border-bottom:1px solid #00ffcc;
}

.page{display:none;padding:10px;}
.active{display:block;}

.post{
border:1px solid #00ffcc33;
padding:10px;
margin:10px 0;
border-radius:10px;
}

input,textarea{
width:100%;
padding:10px;
margin:5px 0;
background:#000;
color:#00ffcc;
border:1px solid #00ffcc;
}

button{
background:#00ffcc;
border:none;
padding:10px;
cursor:pointer;
}
</style>
</head>

<body>

<!-- LOGIN -->
<div id="login">
<h3>Login Artemis V7</h3>
<input id="u" placeholder="Pseudo">
<input id="p" type="password" placeholder="Mot de passe">
<button onclick="login()">Entrer</button>
</div>

<!-- APP -->
<div id="app" style="display:none">

<nav>
<button onclick="show('feed')">Feed</button>
<button onclick="show('create')">Post</button>
<button onclick="show('chat')">Chat</button>
<button onclick="show('profile')">Profil</button>
</nav>

<div id="feed" class="page active"></div>

<div id="create" class="page">
<textarea id="postText"></textarea>
<button onclick="createPost()">Publier</button>
</div>

<div id="chat" class="page">
<div id="chatBox"></div>
<input id="msg">
<button onclick="sendMsg()">Send</button>
</div>

<div id="profile" class="page">
<textarea id="bio"></textarea>
<input id="photo" placeholder="Photo URL">
<button onclick="saveProfile()">Save</button>
</div>

</div>

<!-- FIREBASE -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

<script>
const firebaseConfig = {
apiKey:"YOUR_KEY",
authDomain:"YOUR_DOMAIN",
projectId:"YOUR_ID"
};

firebase.initializeApp(firebaseConfig);
const db=firebase.firestore();

let user="";

/* HASH SIMPLE */
function hash(s){
let h=0;
for(let i=0;i<s.length;i++){
h=(h<<5)-h+s.charCodeAt(i);
h|=0;
}
return h;
}

/* LOGIN */
async function login(){
let u=document.getElementById("u").value;
let p=document.getElementById("p").value;

let ref=db.collection("users").doc(u);
let snap=await ref.get();

if(snap.exists){
if(snap.data().password!=hash(p)){
alert("wrong password");
return;
}
}else{
await ref.set({
password:hash(p),
bio:"",
photoURL:"",
followers:[],
following:[],
online:true
});
}

user=u;

document.getElementById("login").style.display="none";
document.getElementById("app").style.display="block";

loadFeed();
loadChat();
}

/* NAV */
function show(p){
document.querySelectorAll(".page").forEach(e=>e.classList.remove("active"));
document.getElementById(p).classList.add("active");
}

/* CREATE POST */
async function createPost(){
await db.collection("posts").add({
author:user,
text:document.getElementById("postText").value,
likes:[],
time:Date.now()
});

document.getElementById("postText").value="";
}

/* FEED */
function loadFeed(){
db.collection("posts").onSnapshot(snap=>{
let feed=document.getElementById("feed");
feed.innerHTML="";

snap.forEach(doc=>{
let p=doc.data();

feed.innerHTML+=`
<div class="post">
<b>${p.author}</b><br>
${p.text}<br><br>
❤️ ${p.likes.length}
<button onclick="likePost('${doc.id}')">Like</button>
</div>`;
});
});
}

/* LIKE */
async function likePost(id){
let ref=db.collection("posts").doc(id);
let snap=await ref.get();

let likes=snap.data().likes;

if(!likes.includes(user)){
likes.push(user);
}

await ref.update({likes});
}

/* CHAT */
function sendMsg(){
db.collection("messages").add({
from:user,
msg:document.getElementById("msg").value,
time:Date.now()
});

document.getElementById("msg").value="";
}

function loadChat(){
db.collection("messages").onSnapshot(snap=>{
let box=document.getElementById("chatBox");
box.innerHTML="";

snap.forEach(doc=>{
let m=doc.data();
box.innerHTML+=`<div>${m.from}: ${m.msg}</div>`;
});
});
}

/* PROFILE */
async function saveProfile(){
await db.collection("users").doc(user).update({
bio:document.getElementById("bio").value,
photoURL:document.getElementById("photo").value
});
}

</script>

</body>
</html>
